name: Weeks 7-10 offline checks

on:
  push:
    paths:
      - 'week-07-08-rag-mcp-state/**'
      - 'week-09-10-evaluation-production/**'
      - '.github/workflows/weeks-07-10.yml'
  pull_request:
    paths:
      - 'week-07-08-rag-mcp-state/**'
      - 'week-09-10-evaluation-production/**'
      - '.github/workflows/weeks-07-10.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Week 7-8 unit tests
        run: python -B -m unittest discover -s week-07-08-rag-mcp-state -v
      - name: Week 9-10 integration tests
        run: python -B -m unittest discover -s week-09-10-evaluation-production -v
      - name: Evaluation regression gate
        run: python -B week-09-10-evaluation-production/evaluate.py --check
